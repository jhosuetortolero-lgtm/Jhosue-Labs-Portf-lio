<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Jhosue Labs — Software, automação e inteligência artificial">
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#21c07a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6b4bff" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0v48" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0b0f14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="980" cy="120" r="320" fill="url(#glow)"/>

  <g font-family="'Space Grotesk','Segoe UI',sans-serif" fill="#e8efe9">
    <text x="80" y="200" font-size="34" letter-spacing="8" fill="#21c07a">JHOSUE LABS</text>
    <text x="80" y="300" font-size="72" font-weight="700">Sistemas inteligentes</text>
    <text x="80" y="380" font-size="72" font-weight="700">para negócios</text>
    <text x="80" y="450" font-size="30" fill="#9aa8a0">Programador Fullstack e Expert em IA</text>
  </g>

  <g font-family="ui-monospace,'JetBrains Mono',monospace" font-size="24" fill="#9aa8a0">
    <text x="80" y="540">SaaS</text>
    <text x="180" y="540">CRM</text>
    <text x="280" y="540">IA</text>
    <text x="350" y="540">Automação</text>
    <text x="530" y="540">APIs</text>
  </g>

  <rect x="80" y="560" width="180" height="6" rx="3" fill="#21c07a"/>
</svg>
